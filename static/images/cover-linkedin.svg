<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191">
  <rect width="1128" height="191" fill="#0a0a0a"/>

  <!-- Grid lines — matches hero pattern -->
  <g opacity="0.15" stroke="#242424" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="191"/>
    <line x1="160" y1="0" x2="160" y2="191"/>
    <line x1="240" y1="0" x2="240" y2="191"/>
    <line x1="320" y1="0" x2="320" y2="191"/>
