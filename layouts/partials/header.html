<a class="skip-nav" href="#main">Skip to content</a>
<nav class="site-nav" id="site-nav" aria-label="Primary">
  <div class="site-nav__inner">

    <a href="{{ "/" | relURL }}" class="site-nav__logo" aria-label="{{ .Site.Title }}">
      <span class="site-nav__wordmark">Custody<span class="site-nav__wordmark-accent">Zero</span></span>
    </a>

    <!-- Desktop links — hidden on mobile -->
    <ul class="site-nav__links" role="list">
      {{ range .Site.Menus.main }}
      <li><a class="site-nav__link" href="{{ .URL | relURL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>

    <!-- Mobile nav — checkbox drives open/close, zero JS -->
    <div class="nav-mobile">
      <input type="checkbox" id="nav-mobile-open" class="nav-mobile__checkbox" aria-hidden="true">
      <label class="nav-mobile__btn" for="nav-mobile-open" aria-label="Open navigation">
        <svg class="nav-mobile__icon nav-mobile__icon--open" viewBox="0 0 18 13" fill="none" aria-hidden="true" width="18" height="13">
          <rect width="18" height="2" rx="0" fill="currentColor"/>
          <rect y="5.5" width="18" height="2" rx="0" fill="currentColor"/>
          <rect y="11" width="18" height="2" rx="0" fill="currentColor"/>
        </svg>
        <svg class="nav-mobile__icon nav-mobile__icon--close" viewBox="0 0 14 14" fill="none" aria-hidden="true" width="14" height="14">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </label>
      <nav class="nav-mobile__dropdown" aria-label="Site navigation">
        {{ range .Site.Menus.main }}
        <a class="nav-mobile__link" href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>

  </div>
</nav>

<script>
  // Nav scroll behavior
  const nav = document.getElementById('site-nav');
  window.addEventListener('scroll', () => {
    nav.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive: true });
</script>
