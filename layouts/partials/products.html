<style>
/* ── PRODUCTS — scoped styles ────────────────────────────────── */

.products {
  padding: 8rem 3rem;
  border-top: 1px solid var(--border);
  max-width: 1320px;
  margin: 0 auto;
}

.products-header {
  display: flex;
  align-items: baseline;
  gap: 2rem;
  margin-bottom: 4rem;
}

.products-header .section-label {
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--amber);
}

.products-header h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  letter-spacing: 0.05em;
  color: var(--white);
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
}

.product-grid.product-grid-3 {
  grid-template-columns: repeat(3, 1fr);
}

.product-card {
  background: var(--dark);
  padding: 2.25rem;
  position: relative;
  overflow: hidden;
  transition: background 0.3s;
}

.product-card:hover { background: var(--mid); }

.product-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.product-card:hover::before { transform: scaleX(1); }

.product-icon {
  display: block;
  width: 40px;
  height: 40px;
  margin-bottom: 1.5rem;
  opacity: 0.9;
}

.product-tag {
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--amber-dim);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.product-tag::before {
  content: '';
  display: inline-block;
  width: 20px;
  height: 1px;
  background: var(--amber-dim);
}

.product-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  letter-spacing: 0.05em;
  color: var(--white);
  margin-bottom: 1rem;
  line-height: 1;
  text-decoration: none;
  display: block;
}

.product-name:hover {
  color: var(--amber);
}

.product-desc {
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 2rem;
  max-width: 420px;
}

.product-features {
  list-style: none;
  margin-bottom: 2.5rem;
}

.product-features li {
  font-size: 0.78rem;
  color: var(--muted);
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  letter-spacing: 0.04em;
}

.product-features li::before {
  content: '→';
  color: var(--amber);
  font-size: 0.7rem;
  flex-shrink: 0;
}

.product-status {
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.status-soon { color: var(--muted); }

.status-active {
  color: var(--amber);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.status-active::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--amber);
  animation: pulse 2s ease infinite;
  flex-shrink: 0;
}

@media (max-width: 1100px) {
  .product-grid { grid-template-columns: repeat(2, 1fr); }
  /* .product-grid-3 stays 3-col through tablet — 3 cards in 2 cols leaves an empty cell that shows the border color. Collapses to 1-col at the mobile breakpoint below. */
}

@media (max-width: 768px) {
  .products { padding: 5rem 1.5rem; }
  .product-grid,
  .product-grid.product-grid-3 { grid-template-columns: 1fr; }
}
</style>

<section class="products" id="what-we-build" aria-label="Products">
  <div class="products-header reveal">
    <span class="section-label">What we build</span>
    <h2>The instruments</h2>
  </div>
  <div class="product-grid product-grid-3">
    {{ range .Params.products }}
    <article class="product-card reveal">
      {{ with .icon }}
      <img class="product-icon" src="{{ . | relURL }}" alt="" aria-hidden="true" width="40" height="40">
      {{ end }}
      <div class="product-tag">{{ .tag }}</div>
      <a href="{{ .url }}" class="product-name">{{ .name }}</a>
      <p class="product-desc">{{ .description }}</p>
      {{ if eq .status "active" }}
      <span class="product-status status-active">{{ .status_label }}</span>
      {{ else }}
      <span class="product-status status-soon">{{ .status_label }}</span>
      {{ end }}
    </article>
    {{ end }}
  </div>
</section>
